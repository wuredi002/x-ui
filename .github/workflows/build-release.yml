name: Build and publish release

on:
  push:
    tags:
      - '0.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Linux amd64 and arm64 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            root="dist/package-${arch}/x-ui"
            mkdir -p "$root/bin"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$root/x-ui" .
            cp -a bin/. "$root/bin/"
            cp x-ui.service x-ui.sh "$root/"
            tar -C "dist/package-${arch}" -czf "dist/x-ui-linux-${arch}.tar.gz" x-ui
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/x-ui-linux-amd64.tar.gz dist/x-ui-linux-arm64.tar.gz \
            --title "x-ui ${GITHUB_REF_NAME}" \
            --generate-notes
