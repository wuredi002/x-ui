name: Build and publish release

on:
  push:
    tags:
      - '0.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to rebuild and upload release assets for (for example, 0.3.5)"
        required: false
        type: string
      source_ref:
        description: "Git ref to build from (use main to include current fixes)"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag || github.ref }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install C cross-compilers for SQLite
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu

      - name: Build Linux amd64 and arm64 archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            root="dist/package-${arch}/x-ui"
            mkdir -p "$root/bin"
            tmp="$(mktemp -d)"
            if [ "$arch" = "amd64" ]; then
              asset="Xray-linux-64.zip"
              cc="gcc"
            else
              asset="Xray-linux-arm64-v8a.zip"
              cc="aarch64-linux-gnu-gcc"
            fi
            curl -fsSL "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/$asset" -o "$tmp/xray.zip"
            unzip -q "$tmp/xray.zip" -d "$tmp/unpacked"
            test -x "$tmp/unpacked/xray"
            install -m 755 "$tmp/unpacked/xray" "$root/bin/xray-linux-${arch}"
            install -m 644 "$tmp/unpacked/geoip.dat" "$root/bin/geoip.dat"
            install -m 644 "$tmp/unpacked/geosite.dat" "$root/bin/geosite.dat"
            CGO_ENABLED=1 CC="$cc" GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$root/x-ui" .
            cp x-ui.service x-ui.sh "$root/"
            tar -C "dist/package-${arch}" -czf "dist/x-ui-linux-${arch}.tar.gz" x-ui
            rm -rf "$tmp"
          done

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/x-ui-linux-amd64.tar.gz dist/x-ui-linux-arm64.tar.gz --clobber
            gh release edit "$tag" --title "x-ui $tag"
          else
            gh release create "$tag" dist/x-ui-linux-amd64.tar.gz dist/x-ui-linux-arm64.tar.gz \
              --title "x-ui $tag" \
              --generate-notes
          fi
