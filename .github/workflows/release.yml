name: Release Xray Panel
on:
  push:
    tags:
      - 0.*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: |
            Xray 面板 0.5.4

            - 更新 Go 模块依赖并使用 Go 1.27.0 构建。
            - 使用 Xray-core v1.260327.0。
            - 为面板公共模板补充简体中文语言标记、静态资源缓存刷新和弹窗可访问性标签。
            - 保留 0.5.2 的简体中文界面、设备连接设置与节点功能。
          draft: false
          prerelease: false
  linuxamd64build:
    name: build xray amd64 version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.27.x'
      - name: build linux amd64 version
        run: |
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -o xray-release -v main.go
          mkdir -p dist/xray
          cp xray-release dist/xray/xray-release
          cp xray.service dist/xray/xray.service
          cp xray.sh dist/xray/xray.sh
          cd dist/xray
          mv xray-release xray
          mkdir bin
          cd bin
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip Xray-linux-64.zip
          rm -f Xray-linux-64.zip geoip.dat geosite.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-amd64
          cd ..
          cd ..
      - name: package
        run: tar -zcvf xray-linux-amd64.tar.gz -C dist xray
      - name: upload
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: xray-linux-amd64.tar.gz
          asset_name: xray-linux-amd64.tar.gz
          asset_content_type: application/gzip
  linuxarm64build:
    name: build xray arm64 version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.27.x'
      - name: build linux arm64 version
        run: |
          sudo apt-get update
          sudo apt install gcc-aarch64-linux-gnu
          CGO_ENABLED=1 GOOS=linux GOARCH=arm64 CC=aarch64-linux-gnu-gcc go build -o xray-release -v main.go
          mkdir -p dist/xray
          cp xray-release dist/xray/xray-release
          cp xray.service dist/xray/xray.service
          cp xray.sh dist/xray/xray.sh
          cd dist/xray
          mv xray-release xray
          mkdir bin
          cd bin
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-arm64-v8a.zip
          unzip Xray-linux-arm64-v8a.zip
          rm -f Xray-linux-arm64-v8a.zip geoip.dat geosite.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-arm64
          cd ..
          cd ..
      - name: package
        run: tar -zcvf xray-linux-arm64.tar.gz -C dist xray
      - name: upload
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: xray-linux-arm64.tar.gz
          asset_name: xray-linux-arm64.tar.gz
          asset_content_type: application/gzip
  linuxs390xbuild:
    name: build xray s390x version
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.27.x'
      - name: build linux s390x version
        run: |
          sudo apt-get update
          sudo apt install gcc-s390x-linux-gnu -y
          CGO_ENABLED=1 GOOS=linux GOARCH=s390x CC=s390x-linux-gnu-gcc go build -o xray-release -v main.go
          mkdir -p dist/xray
          cp xray-release dist/xray/xray-release
          cp xray.service dist/xray/xray.service
          cp xray.sh dist/xray/xray.sh
          cd dist/xray
          mv xray-release xray
          mkdir bin
          cd bin
          wget https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-s390x.zip
          unzip Xray-linux-s390x.zip
          rm -f Xray-linux-s390x.zip geoip.dat geosite.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat
          wget https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat
          mv xray xray-linux-s390x
          cd ..
          cd ..
      - name: package
        run: tar -zcvf xray-linux-s390x.tar.gz -C dist xray
      - name: upload
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.release.outputs.upload_url }}
          asset_path: xray-linux-s390x.tar.gz
          asset_name: xray-linux-s390x.tar.gz
          asset_content_type: application/gzip
